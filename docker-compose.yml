services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      FALKOR_HOST: falkordb
      FALKOR_PORT: 6379
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8787"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  falkordb_data:
